# Build the standalone web app from a checked-out tree into
# packages/web-app/dist. Shared by publish-npm.yml (the release zip AND, after
# a second branded assemble pass, prod on Pages), deploy-next.yml
# (next), preview-deploy.yml (PR previews) and ci.yml, so what CI tests and
# what ships are built by one sequence.
#
# Checkout is NOT part of this action — a composite action can't run before the
# repo (and this file) is checked out, so callers must check out FIRST, with
# submodules: recursive. Everything after checkout lives here.
#
# The build order is load-bearing and NOT obvious — see the comments below.
# It was derived empirically (a full clean build was run end-to-end); do not
# reorder steps casually. The three ordering traps:
#   1. the @deltachat/jsonrpc-client `file:` dep must be generated + built
#      BEFORE the root `pnpm install` tries to resolve it.
#   2. `pnpm assemble` wipes and repopulates dist/, so `pnpm build` (which
#      emits runtime.js + blobs-sw.js INTO dist/) must run AFTER assemble.
#   3. both cache steps must run AFTER apply-patches — build/core doesn't exist
#      before it (wrong cache key for rust-cache), and apply-patches rm -rf's
#      build/core, which would delete a restored target/ or jsonrpc dist/.
#
# The assemble step bakes in per-instance branding from SLOTHFUL_* environment
# variables. Composite run steps inherit the caller's job-level env as real
# process env vars, so callers set SLOTHFUL_* at the job level (as vars.*) —
# see deploy-next.yml. (publish-npm.yml is the exception: it needs one generic
# build AND one branded one off the same compile, so it leaves the job env
# unset here and re-runs the assemble tail with the vars on that step.) This
# action declares no inputs for them.
#
# EVERY BUILD INPUT IS PINNED. This action runs on release runners, so nothing
# it pulls in may be mutable: third-party actions are pinned to reviewed commit
# SHAs (the trailing comment names the version each SHA is — check one with
# `git ls-remote https://github.com/<owner>/<repo> refs/tags/<version>`, and
# peel annotated tags with the `^{}` entry), wasm-pack is a release asset
# pinned by version and sha256 rather than an installer piped to a shell, and
# the two
# out-of-tree npm installs (the generated jsonrpc client, upstream desktop) run
# `--frozen-lockfile`.

name: Build web-app
description: Toolchains + patched core + wasm + assembled dist for the standalone web-app.

# Both inputs default to the deploy behaviour, so publish-npm.yml,
# deploy-next.yml and preview-deploy.yml pass neither. ci.yml turns both off:
# it needs a functional build, not a shippable one, and the two passes it skips
# are the slowest in the job.
inputs:
  wasm-opt:
    description: >-
      Run wasm-pack's wasm-opt post-pass. Skipping it saves ~5.5 min — longer
      than the Rust compile itself — and only drops binaryen's extra
      size/speed pass; the cargo release profile (opt-level=s + LTO) is kept
      either way.
    default: 'true'
  production:
    description: >-
      Build the release frontend (minified React, debug features hidden) and
      bake devmode:false into config.js. When false, NODE_ENV is left unset
      for both steps, which is what a local build does.
    default: 'true'

runs:
  using: composite
  steps:
    # scripts/apply-patches.sh runs `git am` inside the submodules; git am
    # refuses to commit without an author identity.
    - name: Configure git identity (required by `git am` in apply-patches)
      shell: bash
      run: |
        git config --global user.email "ci@github-actions"
        git config --global user.name "GitHub Actions"

    # sqlite-wasm-rs compiles SQLite's C sources with clang.
    # The runner's preinstalled third-party repos (packages.microsoft.com,
    # google-chrome) intermittently fail clearsign validation or serve a
    # mid-sync index, and ANY failing repo makes `apt-get update` exit 100 and
    # aborts the job. We don't use them, so drop them first; retry to ride out
    # transient hiccups on the base ubuntu archive too.
    - name: Install clang (sqlite-wasm-rs builds C)
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/*microsoft* \
                   /etc/apt/sources.list.d/*azure* \
                   /etc/apt/sources.list.d/*google* \
                   /etc/apt/sources.list.d/*chrome*
        for i in 1 2 3; do sudo apt-get update && break || sleep $((i*5)); done
        sudo apt-get install -y clang

    # dtolnay/rust-toolchain has no release tags — the action lives on one
    # branch per toolchain, so this is the head of its `stable` branch. The
    # branch is what sets the `toolchain` input's default, i.e. this SHA still
    # installs whatever rustc is stable at run time; only the action's own code
    # is frozen. (The wasm build itself runs on the dated nightly that
    # packages/core-wasm/rust/rust-toolchain.toml pins.)
    - name: Install Rust stable + wasm32 target
      id: toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      with:
        targets: wasm32-unknown-unknown

    - name: Setup Node 22 + pnpm (corepack)
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Enable corepack (provides the pinned pnpm)
      shell: bash
      run: corepack enable

    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # Recreate build/core + build/desktop worktrees from the pinned submodule
    # commits + patch stacks (build/core = patched core, build/desktop =
    # upstream desktop, 0 patches).
    - name: Apply patch stacks (creates build/core, build/desktop)
      shell: bash
      run: pnpm apply-patches

    # Mark fork-touched JSON-RPC items with 🦥 in their Rust doc comments, so
    # the generated docs say what is ours. ORDER: after apply-patches (it needs
    # build/core's per-patch commits to git blame) and BEFORE the `cargo test`
    # below — that is what turns `///` into both the TS JSDoc and the OpenRPC
    # descriptions, so marking any later marks nothing. Node builtins only, so
    # it runs fine before the root `pnpm install`.
    - name: Mark fork-touched API in the generated docs
      shell: bash
      run: node scripts/mark-fork-api.mjs

    # Cache the cargo registry + the build/core and wasm target/ dirs. The
    # native `cargo test` and the ~10-min release wasm build dominate wall
    # time, so this is the cache that matters most.
    # ORDER TRAP #3: this MUST run after apply-patches. rust-cache hashes the
    # workspaces' Cargo.lock files at restore time — build/core only exists
    # once apply-patches has created it, so running earlier computes a key
    # blind to the core dependency graph. Worse, apply-patches recreates
    # build/core with `rm -rf`, which would wipe a restored build/core/target.
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      env:
        # Save the cache even when the job fails — otherwise a broken deploy
        # rebuilds the ~10-min wasm step from scratch on every retry.
        CACHE_ON_FAILURE: true
      with:
        workspaces: build/core

        # core-wasm's target/ used to be a second `workspaces` entry, which ran
        # it through rust-cache's post-run pruning — and it came back unusable.
        # Measured on run 31038961381 (main, `full match: true`, 1448 MB
        # restored): the wasm step still compiled all 502 crates from
        # unicode-ident up, in 3m45s — the same as the cold run beside it.
        # cache-directories is stored verbatim, with no pruning pass.
        cache-directories: packages/core-wasm/rust/target

        # core-wasm's lockfile is a superset of core's, so with core-wasm out of
        # `workspaces` the default pruning would drop every crate that only the
        # wasm build needs. Keeping the whole registry costs some cache size;
        # re-fetching those crates costs the wasm build.
        cache-all-crates: true

        # Leaving `workspaces` also took core-wasm's lockfile out of the cache
        # KEY, and that is not survivable on its own: rust-cache skips the save
        # entirely when the restored key is an exact match, so a wasm-only
        # dependency bump — routine here, since the lint job audits exactly this
        # lockfile — would restore a full match, save nothing, and leave the new
        # crates out of the cache until build/core's lockfile or the ambient
        # stable rustc happened to change, up to six weeks later. Folding both
        # wasm-side inputs back in by hand restores the property `workspaces`
        # was providing. rust-toolchain.toml is in here so that pinning the
        # channel (or bumping a pinned one) also mints a new key.
        key: ${{ hashFiles('packages/core-wasm/rust/Cargo.lock', 'packages/core-wasm/rust/rust-toolchain.toml') }}

        # One cache entry for every workflow that builds the web-app instead of
        # one per job name. Without this the key carries the job name, so CI's
        # `test`, publish-npm'/preview-deploy's `build` and deploy-next's
        # `deploy` each kept a private ~1.1 GB copy — and preview-deploy, which
        # only ever runs on PRs, could never populate its own at all.
        shared-key: web-app-build

        # Only main (and a hand-triggered run) writes the cache. GitHub scopes
        # caches per branch and evicts at 10 GB per repo, so while every PR run
        # saved its own ~1.1 GB copy the budget churned through more than once a
        # day and main's entry — the only one a PR can read — kept getting
        # evicted. PRs then rebuilt core from scratch: 20.4 min against 13.2.
        # workflow_dispatch is the escape hatch for testing a cache change on a
        # branch without merging it first.
        save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    # The generated client is a pure function of the patched core tree, so it
    # only changes when the vendor/core pin or the core patch stack does —
    # roughly never, next to the per-commit churn this job sees. Caching it
    # skips the `cargo test` below, which compiles all 545 crates of core
    # natively (7m27s cold, 79s warm) purely to emit TypeScript bindings.
    #
    # Keyed on the submodule pin + the patch files rather than on build/core's
    # HEAD: `git am` stamps a fresh committer date, so the patched sha differs
    # on every run and would never hit.
    - name: Resolve the core revision behind build/core
      id: core-rev
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:vendor/core)" >> "$GITHUB_OUTPUT"

    # Only dist/ — that is all a consumer of the `file:` dep needs (package.json
    # is checked in, and pnpm resolves the client's own deps through the root
    # lockfile). The sub-package's node_modules and the generated/ bindings are
    # build inputs, wanted only on the miss path where the step below runs.
    #
    # The rustc version is in the key even though the TypeScript output does not
    # depend on it, and that is deliberate. This cache is what decides whether
    # `cargo test` runs, and `cargo test` is the only thing that populates
    # build/core/target. Let the two keys drift apart and a stable-rustc bump
    # misses the rust-cache but hits this one: the first main run after it would
    # skip the compile and then save a build/core/target holding nothing but
    # stale artifacts, which the exact-match skip-save then freezes in place.
    # Sharing the rustc component makes both caches miss together, so the one
    # regeneration lands on main instead of on the next core-bump PR.
    - name: Cache the generated @deltachat/jsonrpc-client
      id: jsonrpc-client
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # All three, not just dist/: the generate step below is skipped
        # wholesale on a cache hit, so whatever is left out is simply absent on
        # the next run. docs/ is typedoc's output and generated/ holds yerpc's
        # openrpc.json — both are what /api-docs ships, and assemble.mjs only
        # warns when they are missing. Caching dist/ alone therefore ships no
        # API docs at all, silently, from the second run with a warm key on.
        path: |
          build/core/deltachat-jsonrpc/typescript/dist
          build/core/deltachat-jsonrpc/typescript/docs
          build/core/deltachat-jsonrpc/typescript/generated
        # Every input to the cached output is in the key, because the step that
        # produces it is skipped wholesale on a hit — anything left out restores
        # stale content and the change appears to have done nothing:
        # mark-fork-api.mjs (docs/ and generated/ carry its 🦥 marks), and
        # typedoc.json + typedoc-readme.md (the only inputs to the typedoc run
        # that writes docs/).
        key: jsonrpc-client-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.core-rev.outputs.sha }}-${{ hashFiles('patches/core/*.patch', 'scripts/mark-fork-api.mjs', 'packages/web-app/api-docs/typedoc.json', 'packages/web-app/api-docs/typedoc-readme.md') }}

    # rustwasm's prebuilt musl binary, pinned by version AND sha256, replacing
    # the upstream `curl … installer/init.sh | sh` — which was unversioned
    # (whatever was newest that day) and unverified (whatever that URL served
    # that day). Same shape as ci.yml's cargo-audit step; the long-form
    # reasoning for choosing a digest-checked release asset over both a piped
    # installer and a `cargo install` source build lives there, and the two
    # steps should stay in step.
    #
    # `cargo install wasm-pack --version … --locked` would pin just as tightly
    # (cargo checks the crate against the index's sha256), but it compiles
    # wasm-pack from source on every run that does not restore ~/.cargo/bin —
    # i.e. every PR run, since save-if above stopped PRs writing that cache.
    # Downloading takes ~2s and does not care whether the cache was warm.
    #
    # Bumping: change both env vars together. Re-deriving the digest from the
    # tarball you just downloaded only blesses whatever you got, so cross-check
    # a bump against a second source — `cargo install wasm-pack --version <new>`
    # locally and compare `wasm-pack --version` — before pasting it.
    - name: Install wasm-pack (prebuilt, pinned + digest-checked)
      shell: bash
      env:
        WASM_PACK_VERSION: 0.15.0
        WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
      run: |
        set -euo pipefail
        dir="wasm-pack-v$WASM_PACK_VERSION-x86_64-unknown-linux-musl"
        curl -sSfL --retry 3 --retry-connrefused -o wasm-pack.tgz \
          "https://github.com/rustwasm/wasm-pack/releases/download/v$WASM_PACK_VERSION/$dir.tar.gz"
        echo "$WASM_PACK_SHA256  wasm-pack.tgz" | sha256sum -c -
        tar -xzf wasm-pack.tgz -C "$HOME/.cargo/bin" --strip-components=1 "$dir/wasm-pack"
        rm -f wasm-pack.tgz
        wasm-pack --version

    # ORDER TRAP #1: generate + build the @deltachat/jsonrpc-client TS client
    # from the patched core at its pinned commit. `cargo test` generates the
    # TS bindings AND (via patches/core, openrpc_outdir) generated/openrpc.json;
    # then constants, tsc, esbuild bundle, and typedoc (upstream's devDependency,
    # our options file) — assemble.mjs copies docs/ + openrpc.json under
    # dist/api-docs/ next to the two pages web-app/api-docs/ holds, and
    # core-wasm's build:types vendors dist/*.d.ts into its published package.
    # This is a `file:` dep of core-wasm, so it MUST exist before the root
    # `pnpm install` below.
    # (local pnpm-workspace.yaml: builds in isolation from the root workspace
    # AND carries allowBuilds — pnpm 11 hard-errors on esbuild's postinstall
    # otherwise; --ignore-workspace can't work here since it makes pnpm skip
    # the very file that holds the allowBuilds setting. esbuild's postinstall
    # is unwanted anyway, its JS launcher is what we bundle with.)
    # The lockfile is ours, not upstream's: this package.json ships 17 floating
    # `^` ranges and no lock, so a bare `pnpm install` here resolved a fresh
    # dependency tree — with its install scripts — on every release build. To
    # refresh it after a vendor/core bump (--frozen-lockfile will fail loudly
    # and name the drift): copy the new package.json into an empty dir next to
    # a `printf 'allowBuilds:\n  esbuild: false\n' > pnpm-workspace.yaml`, run
    # `pnpm install --lockfile-only`, and commit the pnpm-lock.yaml it writes.
    - name: Generate + build @deltachat/jsonrpc-client (before root install)
      if: steps.jsonrpc-client.outputs.cache-hit != 'true'
      working-directory: build/core/deltachat-jsonrpc/typescript
      shell: bash
      run: |
        printf 'allowBuilds:\n  esbuild: false\n' > pnpm-workspace.yaml
        cp "$GITHUB_ACTION_PATH/jsonrpc-client-pnpm-lock.yaml" pnpm-lock.yaml
        pnpm install --frozen-lockfile
        cargo test -p deltachat-jsonrpc
        node scripts/generate-constants.js
        ./node_modules/.bin/tsc
        ./node_modules/.bin/esbuild --format=esm --bundle dist/deltachat.js --outfile=dist/deltachat.bundle.js
        # Not upstream's `docs` script: same typedoc, our options file, which
        # names the project as this fork, gives it the /api-docs readme as its
        # index page and puts RawClient first in the nav. Paths inside the
        # options file resolve against the file, so entry point and out dir
        # point back here.
        ./node_modules/.bin/typedoc --options ../../../../packages/web-app/api-docs/typedoc.json

    - name: Install workspace deps
      shell: bash
      run: pnpm install

    # Upstream deltachat-desktop browser bundle (its own workspace/lockfile).
    # assemble.mjs copies its dist/ output. esbuild builds fine in-tree here.
    # VERSION_INFO_GIT_REF: upstream's build stamps a `git describe` into the
    # bundle, which fails here (worktree has no tags) — pass the sha instead.
    # NODE_ENV=production: release frontend (minified React, debug features
    # hidden) — only on the build, NOT on `pnpm install` (production install
    # would skip the devDependencies the build needs). Local builds stay dev.
    - name: Build upstream desktop browser frontend
      working-directory: build/desktop
      shell: bash
      run: |
        export VERSION_INFO_GIT_REF=$(git rev-parse --short HEAD)
        pnpm install --frozen-lockfile
        # branch rather than NODE_ENV=development: unset is what the non-release
        # build has always run with, and the two are not the same to every tool.
        if [ "${{ inputs.production }}" = "true" ]; then
          NODE_ENV=production pnpm build:browser
        else
          pnpm build:browser
        fi

    # Release wasm (opt-level=s + LTO); dev builds crash the browser tab.
    # ~10 min uncached.
    - name: Build wasm core
      shell: bash
      run: |
        if [ "${{ inputs.wasm-opt }}" = "true" ]; then
          pnpm --filter @slothfulchat/core-wasm build:wasm
        else
          pnpm --filter @slothfulchat/core-wasm build:wasm:ci
        fi

    # The account template is generated BY the wasm just built (a headless run
    # of it creates an account and hands the migrated database back), which is
    # what keeps it from ever describing a schema this build does not have.
    # Hence the browser here, in the build rather than in the test job.
    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-
    - name: Install Playwright chromium
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    # Optional at runtime (a missing template only costs account-creation
    # speed), but NOT optional here: a silent skip would ship the slow path to
    # everyone, so let a failure fail the build.
    - name: Generate the new-account database template
      shell: bash
      run: pnpm --filter @slothfulchat/core-wasm gen-template

    - name: Build core-wasm TS (worker + index)
      shell: bash
      run: pnpm --filter @slothfulchat/core-wasm build

    # The 🦥 fork marks are injected in Rust and have to survive three
    # generators to reach a reader. They already stopped doing so once, quietly
    # and only for methods. Needs the generated client, the OpenRPC document
    # and the typedoc HTML — all three come out of the jsonrpc-client step
    # above, so this could run earlier; it sits here for readability.
    - name: Verify the fork marks reached every docs surface
      shell: bash
      run: node scripts/verify-fork-marks.mjs

    # ORDER TRAP #2: assemble wipes+repopulates dist/ (upstream bundle,
    # locales, wasm worker, index.html, .nojekyll); build emits runtime.js +
    # blobs-sw.js INTO dist/. build MUST come after assemble.
    # Per-instance config (SLOTHFUL_*) is inherited from the caller's job env.
    - name: Assemble web-app dist/ (upstream bundle + wasm + overlays)
      shell: bash
      run: pnpm --filter @slothfulchat/web-app assemble
      env:
        # release: bakes devmode:false into config.js (runtime rc_config).
        # instance-config.mjs tests `!== 'production'`, so '' reads as dev.
        NODE_ENV: ${{ inputs.production == 'true' && 'production' || '' }}
    - name: Build web-app runtime + service worker (into dist/)
      shell: bash
      run: pnpm --filter @slothfulchat/web-app build
