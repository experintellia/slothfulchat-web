# The single release gate, called by every workflow that can publish or deploy
# production (publish-npm.yml, deploy-pages.yml).
#
# A TAG IS THE ONLY RELEASE AUTHORITY. It lives here, once, on purpose: two
# copies of a security gate drift, and a drifted gate is a hole. Callers run it
# as their first job and hang everything else off `needs:`, so no job holding
# publish or deploy privileges even exists until this has passed.
#
# It proves four things about the commit being released:
#   1. the ref is a tag (a branch — including a workflow_dispatch on one —
#      cannot release);
#   2. the tag still points where it did when the run started (nobody moved it
#      underneath us);
#   3. its commit is an ancestor of main (no releasing unmerged work);
#   4. the required CI checks SUCCEEDED for that exact commit — not queued, not
#      still running, not green on some neighbouring commit. Without it a tag
#      pushed onto a merged-but-still-building commit ships unverified code.
# Plus the synced-release-train check: a tag vX.Y.Z means EVERY package is at
# X.Y.Z, so a half-bumped set never ships.
#
# Callers must ALSO pin their build checkout to `${{ github.sha }}` rather than
# the tag name — otherwise a tag moved during the build would be built and
# shipped despite having been verified here.
#
# What this gate CANNOT prove: that it is itself intact. A tag-push run uses
# the workflow files AT the tagged commit, so whoever can push a `v*` tag to an
# unmerged commit can push one where this file — or the caller's `needs:` on it
# — has been weakened. Closing that needs GitHub-side tag rulesets and
# environment reviewers, which live in repo settings, not in git: see the
# "Repository settings the release model depends on" checklist in RELEASING.md.

name: Verify release tag

on:
  workflow_call:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the check-runs read below. A caller that doesn't grant it fails the
      # whole run at validation ("requesting 'checks: read'...") — deliberately
      # loud: a caller that can't ask about CI must not release.
      checks: read
    steps:
      # fetch-depth: 0 makes checkout fetch every branch and tag, so
      # origin/main and the tag AS IT IS ON THE REMOTE are both present.
      - name: Checkout (full history — the ancestor check needs main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the ref is a tag, unmoved, and on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::$GITHUB_REF is not a tag — releases come from tags only. Tag the commit and push the tag (see RELEASING.md)."
            exit 1
          fi
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          tag_sha=$(git rev-list -n1 "refs/tags/$GITHUB_REF_NAME")
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $GITHUB_REF_NAME points at $tag_sha but this run is on $GITHUB_SHA — the tag moved; delete and re-create it, then re-run."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — only tags of merged commits may be released."
            exit 1
          fi
          echo "$GITHUB_REF_NAME = $GITHUB_SHA, on main"

      # Being on main is not the same as being green: CI on a merge commit is
      # still running for minutes after the merge, and a tag pushed in that
      # window used to sail through. Ask about $GITHUB_SHA — the tag's commit,
      # proven unmoved above — so this is the code that will actually ship.
      # REQUIRED_CHECKS are ci.yml's job ids (its check-run names): rename a job
      # there and this list must follow, or every release fails until it does.
      # filter=latest keeps only the newest attempt of each check, so a re-run
      # replaces its predecessor's verdict instead of adding to it.
      - name: Verify required CI succeeded for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: lint test
        run: |
          fail=0
          for check in $REQUIRED_CHECKS; do
            # No answer means no release: a 403 (caller without `checks: read`),
            # a 404, a network blip or malformed JSON all exit non-zero here
            # rather than being read as "nothing failed".
            state=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check&filter=latest" \
              --jq '"\(.check_runs[0].status // "missing") \(.check_runs[0].conclusion // "none")"') || {
              echo "::error::could not read check runs for '$check' on $GITHUB_SHA — refusing to release without proof CI passed. If this was a 403, the calling workflow's verify-tag job is missing 'checks: read'."
              exit 1
            }
            # "missing none" (CI never ran on this commit), "in_progress none"
            # (still building) and any non-success conclusion all land here.
            if [ "$state" != "completed success" ]; then
              echo "::error::required check '$check' is '$state' for $GITHUB_SHA, want 'completed success' — a release tag must point at a commit whose CI has passed. Wait for CI to finish, or fix it, then re-create the tag."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "required CI green on $GITHUB_SHA: $REQUIRED_CHECKS"

      # Synced release train: a tag vX.Y.Z means EVERY package is at X.Y.Z
      # (see RELEASING.md). Fail fast — before the ~10-min wasm build — if any
      # package drifted from the tag, so a half-bumped set never ships.
      # grep/sed only: runs before Node is even set up. web-app is private (not
      # published) but must still match, so the running version is one number.
      - name: Verify all package versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for dir in packages/ws-tcp-proxy packages/core-wasm packages/customize packages/web-app; do
            v=$(grep -m1 '"version"' "$dir/package.json" | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
            if [ "$v" != "$tag" ]; then
              echo "::error::$dir is at $v but the tag is v$tag"
              fail=1
            fi
          done
          if [ "$fail" != 0 ]; then
            echo "Version drift — bump every package to $tag before tagging: node scripts/set-release-version.mjs $tag"
            exit 1
          fi
          echo "all packages at $tag"
