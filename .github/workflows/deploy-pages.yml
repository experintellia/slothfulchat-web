# GitHub Pages is the PROD deployment (web.slothful.chat) and deploys on
# release tags (v*), NOT on main. Main-branch deployments live on
# next.slothful.chat via deploy-next.yml.
#
# The github-pages environment needs a `v*` tag deployment rule (repo Settings
# -> Environments -> github-pages -> "Deployment branches and tags") or tag
# deploys are rejected with "not allowed to deploy due to environment
# protection rules". Tag-push runs use the workflow file AT the tag's commit,
# so this trigger applies to tags created after it merges; workflow_dispatch
# stays as a manual fallback.
#
# The build sequence lives in .github/actions/build-web-app (shared with the
# preview + next deploys); its step order is load-bearing — see that file.
#
# To enable: repo Settings -> Pages -> Source = "GitHub Actions".
#
# A TAG IS THE ONLY RELEASE AUTHORITY — this is PROD, held to the same gate as
# npm publishing (verify-release-tag.yml, shared with publish-npm.yml so the two
# can never drift apart on what counts as a release). Nothing builds and no job
# holding pages/id-token privileges even exists until the ref is proven to be an
# unmoved tag, on main, whose package versions match it. `workflow_dispatch`
# stays as a manual fallback but only helps against a tag ref, where it passes
# the identical gate — so it buys an attacker nothing a tag push wouldn't.

name: Deploy web-app to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# One deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-tag:
    # A called workflow can only ever DOWNGRADE the caller's token, so the gate
    # needs its read grants handed to it here — top-level `permissions: {}` would
    # otherwise cap it at nothing and its checkout would fail. `checks: read` is
    # the gate's CI-is-green check; without it the run fails at validation.
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/verify-release-tag.yml

  build:
    needs: verify-tag
    # Belt and braces: verify-tag failing already blocks this job, and this `if`
    # keeps the deploy privileges out of reach of a branch run even if that gate
    # is ever weakened. Both are needed.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # No id-token here: minting the OIDC token that authenticates the Pages
    # deploy is the deploy job's business, and this job runs the build scripts.
    # `pages: write` stays because actions/configure-pages reads/writes the Pages
    # settings; it cannot deploy on its own, and the gate above means this job
    # only ever runs on a merged, verified tag.
    permissions:
      contents: read
      pages: write
    # Per-instance config baked into config.js by the composite action's
    # assemble step, which inherits these as process env. Set them under
    # Settings -> Secrets and variables -> Actions. All optional: unset ->
    # generic build with a placeholder imprint.
    env:
      SLOTHFUL_INSTANCE_NAME: ${{ vars.SLOTHFUL_INSTANCE_NAME }}
      SLOTHFUL_INSTANCE_URL: ${{ vars.SLOTHFUL_INSTANCE_URL }}
      SLOTHFUL_DEFAULT_PROXY: ${{ vars.SLOTHFUL_DEFAULT_PROXY }}
      SLOTHFUL_PUBLIC_BRIDGES: ${{ vars.SLOTHFUL_PUBLIC_BRIDGES }}
      SLOTHFUL_DEFAULT_CHATMAIL: ${{ vars.SLOTHFUL_DEFAULT_CHATMAIL }}
      SLOTHFUL_RELAY_DIRECTORY: ${{ vars.SLOTHFUL_RELAY_DIRECTORY }}
      SLOTHFUL_IMPRINT_NAME: ${{ vars.SLOTHFUL_IMPRINT_NAME }}
      SLOTHFUL_IMPRINT_ADDRESS: ${{ vars.SLOTHFUL_IMPRINT_ADDRESS }}
      SLOTHFUL_IMPRINT_EMAIL: ${{ vars.SLOTHFUL_IMPRINT_EMAIL }}
      SLOTHFUL_HIDE_PUBLIC_SUGGESTIONS: ${{ vars.SLOTHFUL_HIDE_PUBLIC_SUGGESTIONS }}
      # anonymous usage stats: unset -> no analytics (see instance-config.mjs)
      SLOTHFUL_PLAUSIBLE_DOMAIN: ${{ vars.SLOTHFUL_PLAUSIBLE_DOMAIN }}
      SLOTHFUL_PLAUSIBLE_API: ${{ vars.SLOTHFUL_PLAUSIBLE_API }}
    steps:
      # Pinned to the SHA verify-tag checked, not to the tag name: the tag could
      # be moved during the ~10-min build, and this job would otherwise pick up
      # whatever it points at then.
      - name: Checkout (with submodules — vendor/core + vendor/deltachat-desktop)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Build web-app dist/
        uses: ./.github/actions/build-web-app

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web-app/dist

  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The privileged job, and the only one: id-token mints the OIDC token
    # actions/deploy-pages authenticates prod with. It checks out nothing and
    # runs no repository code — it only publishes the artifact build produced.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
