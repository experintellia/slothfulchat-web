# On tag push: build ONCE, then ship three ways — the GitHub release (prebuilt
# web-app zip + the standalone customize script), the three npm packages, and
# the prod GitHub Pages deploy (web.slothful.chat).
#
# ONE BUILD, THREE OUTPUTS. deploy-pages.yml used to run its own copy of the
# same ~20-min build (patched core, native `cargo test` for the jsonrpc client,
# upstream desktop bundle, ~10-min wasm) on the same commit, because its output
# differs from the release zip's — prod bakes in the flagship branding, the zip
# stays generic so every self-hoster can use it. But branding only enters at
# `assemble`, the cheap tail: so the build job packs the generic zip first and
# then re-runs just assemble+build with the SLOTHFUL_* vars set (~30s). The
# expensive half happens once, and what CI verified, what self-hosters download
# and what prod serves all come off one compile instead of two that could in
# principle differ. (issue #242)
#
# NEVER RENAME THIS FILE. Each package's npmjs.com Settings -> Trusted
# Publisher points at this repo + this workflow FILENAME. Auth is npm Trusted
# Publishing (OIDC, id-token: write) — no token secret.
#
# A TAG IS THE ONLY RELEASE AUTHORITY. The trusted publisher will sign whatever
# this workflow hands it, so nothing but a verified tag may reach it: the
# verify-tag job gates everything, and the two id-token: write grants live on
# the publish and deploy jobs alone (permissions are per-job and can't be made
# conditional). Manual runs are still allowed — but only against a tag ref,
# where they pass the same gate, so `workflow_dispatch` buys an attacker
# nothing a tag push wouldn't.
#
# FIVE JOBS, AND THE SPLIT IS THE POINT. `build` is where repository-controlled
# code runs: checkout with submodules, apply-patches, cargo, the pnpm/npm
# dependency trees and their install scripts, the upstream desktop build. It
# holds `contents: read` and nothing else — no OIDC, no write token, no deploy
# secret — and hands over three artifacts. `release`, `publish` and `deploy`
# then run on fresh runners that check out NOTHING and execute no repository
# code: one uploads the files build prepared, one hands build's npm tarballs to
# `npm stage publish --ignore-scripts`, one hands build's Pages artifact to
# actions/deploy-pages. So a compromised action, build script or transitive
# postinstall now runs on a machine with no publishing or deploying power at
# all, instead of alongside the OIDC request variables and the checkout
# credential. Adding a checkout or a build step to any of the three undoes
# this — don't.
#
# `release`/`publish` and `deploy` hang off `build` INDEPENDENTLY, and that is
# load-bearing: merging the two workflows must not merge their failure modes.
# A package whose trusted publisher is misconfigured can no more hold prod back
# than a rejected Pages deploy can block the release.
#
# STAGED NPM PUBLISHING: `npm stage publish`, not `npm publish` — the three
# packages go into npm's stage queue, where they are invisible to
# `npm install`, and only become installable when a maintainer approves them
# (2FA, `npm stage approve` or npmjs.com; see RELEASING.md). That closes the
# window this workflow used to have: publishing straight to `latest` one
# package at a time meant a failure partway through left `latest` describing
# half a train — new ws-tcp-proxy, old core-wasm — until someone re-ran the
# tag. Now a mid-train failure leaves nothing installable at all. Staging uses
# the SAME OIDC trusted publishing as before, so this costs no token secret;
# approval is deliberately the one thing an OIDC token may not do. (issue #241)
#
# Versioning: synced release train — a `v*` tag means EVERY package is at that
# version. Bump them all in lockstep first (node scripts/set-release-version.mjs
# X.Y.Z), commit, tag, push; a guard step rejects a tag whose packages drifted.
# Each package is still staged only if its version isn't on the registry yet,
# so re-running a tag is idempotent (an existing complete release is skipped —
# releases are immutable, assets attach at creation only).
#
# The release zip is a GENERIC build: no SLOTHFUL_* vars, placeholder imprint.
# Self-hosters bake their values in with the customize script — see
# SELFHOSTING.md — so the zip works for everyone without rebuilding.
#
# The build itself is .github/actions/build-web-app, the same composite the
# other deploy workflows and CI run — so the release zip is built by the
# sequence that is tested on every PR, and its three ordering traps are
# documented in exactly one place.

name: Release (GitHub release + npm + Pages)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# One release train at a time; never cancel an in-flight publish. Two tags
# pushed close together must run to completion in order — interleaved runs can
# finish out of order and race the create-release/publish steps, and two
# overlapping stage/approve cycles are the same incoherent-`latest` failure the
# staged publishing above exists to prevent. (GitHub keeps at most one run
# queued per group; a superseded queued tag is skipped, and re-running it by
# hand is safe — the whole workflow is idempotent per tag.) The Pages deploy
# keeps its own "pages" group at job level, so it doesn't queue behind this.
concurrency:
  group: "publish-npm"
  cancel-in-progress: false

jobs:
  # The gate (see header). Cheap and first: no build runs, and no job holding
  # id-token: write even exists, until the ref is proven to be a released tag.
  verify-tag:
    # A called workflow can only ever DOWNGRADE the caller's token, so the gate
    # needs its read grants handed to it here — top-level `permissions: {}` would
    # otherwise cap it at nothing and its checkout would fail. `checks: read` is
    # the gate's CI-is-green check; without it the run fails at validation.
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/verify-release-tag.yml

  # Unprivileged: this is the job that runs the repo's own code (see header).
  build:
    needs: verify-tag
    # Belt and braces: verify-tag failing already blocks this job, and this `if`
    # keeps a branch run out of the release path even if that gate is ever
    # weakened. Repeated on the three privileged jobs below rather than
    # inherited through `needs:` — they must not depend on how skip propagation
    # works.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the SHA verify-tag checked, not to the tag name: the tag could
      # be moved during the ~10-min build, and this job would otherwise pick up
      # whatever it points at then.
      # persist-credentials: false — nothing here pushes, so the token should
      # not sit in .git/config while the build runs third-party code.
      - name: Checkout (with submodules — vendor/core + vendor/deltachat-desktop)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      # Deliberately NO SLOTHFUL_* vars on this job — unset is what makes the
      # zip generic (see header), and the branded pass below sets them on its
      # own step instead. A job-level copy would reach this build too (composite
      # run steps inherit job env as real process env) and the zip would stop
      # being generic. Defaults give the shippable build: wasm-opt on,
      # NODE_ENV=production.
      - name: Build web-app dist/ (generic release build)
        uses: ./.github/actions/build-web-app

      # bundled single-file CLI: goes into the npm tarball below AND is
      # attached to the GitHub release so self-hosters can run it without npm.
      - name: Build customize CLI bundle
        run: pnpm --filter @slothfulchat/customize build

      # --ignore-scripts: customize has a `prepack` that rebuilds the bundle,
      # and the step above already did. Packing here rather than in the publish
      # job is the whole point — what gets signed is a tarball produced on an
      # unprivileged runner and reviewed as an artifact.
      #
      # ORDER: this must come BEFORE the branded re-assemble below, which wipes
      # dist/ — the zip is the generic build or it is nothing.
      - name: Pack the release assets and the npm tarballs
        run: |
          set -euo pipefail
          mkdir -p out/npm
          (cd packages/web-app/dist && zip -qr "$GITHUB_WORKSPACE/out/slothfulchat-web-$GITHUB_REF_NAME.zip" .)
          cp packages/customize/dist/cli.mjs out/slothfulchat-customize.mjs
          for dir in packages/ws-tcp-proxy packages/core-wasm packages/customize; do
            (cd "$dir" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/out/npm")
          done
          ls -l out out/npm

      - name: Upload the GitHub release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            out/slothfulchat-web-*.zip
            out/slothfulchat-customize.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Upload the npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: out/npm
          if-no-files-found: error
          retention-days: 1

      # The prod build, off the compile that already happened (see header).
      # Per-instance config baked into config.js by assemble, which reads these
      # as process env. Set them under Settings -> Secrets and variables ->
      # Actions. All optional: unset -> generic build with a placeholder
      # imprint — which is exactly what the zip above already is, so leaving
      # them unset makes this pass a no-op rather than a broken deploy.
      #
      # These two commands are build-web-app's tail, and its ORDER TRAP #2
      # applies here too: assemble wipes and repopulates dist/, build emits
      # runtime.js + blobs-sw.js INTO dist/, so build MUST come second.
      # NODE_ENV=production matches what the composite passes assemble on a
      # release build (bakes devmode:false into config.js).
      - name: Re-assemble dist/ with the flagship branding (Pages only)
        env:
          NODE_ENV: production
          SLOTHFUL_INSTANCE_NAME: ${{ vars.SLOTHFUL_INSTANCE_NAME }}
          SLOTHFUL_INSTANCE_URL: ${{ vars.SLOTHFUL_INSTANCE_URL }}
          SLOTHFUL_DEFAULT_PROXY: ${{ vars.SLOTHFUL_DEFAULT_PROXY }}
          SLOTHFUL_PUBLIC_BRIDGES: ${{ vars.SLOTHFUL_PUBLIC_BRIDGES }}
          SLOTHFUL_DEFAULT_CHATMAIL: ${{ vars.SLOTHFUL_DEFAULT_CHATMAIL }}
          SLOTHFUL_RELAY_DIRECTORY: ${{ vars.SLOTHFUL_RELAY_DIRECTORY }}
          SLOTHFUL_IMPRINT_NAME: ${{ vars.SLOTHFUL_IMPRINT_NAME }}
          SLOTHFUL_IMPRINT_ADDRESS: ${{ vars.SLOTHFUL_IMPRINT_ADDRESS }}
          SLOTHFUL_IMPRINT_EMAIL: ${{ vars.SLOTHFUL_IMPRINT_EMAIL }}
          SLOTHFUL_HIDE_PUBLIC_SUGGESTIONS: ${{ vars.SLOTHFUL_HIDE_PUBLIC_SUGGESTIONS }}
          SLOTHFUL_SUPPORT_URL: ${{ vars.SLOTHFUL_SUPPORT_URL }}
          SLOTHFUL_CRASH_REPORT_URL: ${{ vars.SLOTHFUL_CRASH_REPORT_URL }}
          # anonymous usage stats: unset -> no analytics (see instance-config.mjs)
          SLOTHFUL_PLAUSIBLE_DOMAIN: ${{ vars.SLOTHFUL_PLAUSIBLE_DOMAIN }}
          SLOTHFUL_PLAUSIBLE_API: ${{ vars.SLOTHFUL_PLAUSIBLE_API }}
        run: |
          set -euo pipefail
          pnpm --filter @slothfulchat/web-app assemble
          pnpm --filter @slothfulchat/web-app build

      # Boot the artifact that is about to go live. Without this, the optimized
      # production build (wasm-opt on, minified frontend, devmode:false) was
      # never executed before deployment — CI only ever smokes the --no-opt dev
      # build. Same suite ci.yml runs, in its production mode (SMOKE_PRODUCTION,
      # see scripts/smoke-web-app.mjs): core boots, frontend renders, the
      # SW-controlled reload works, no CSP violations or page errors.
      # This stays in the unprivileged build job on purpose — the deploy job
      # below must keep checking out nothing and running no repository code.
      # It smokes the BRANDED dist, the one prod serves; the generic zip differs
      # from it only in the four files assemble templates (config.js, imprint,
      # <title>, manifest) and is packed above from the same compile.
      # No playwright install step: the build action above already installed
      # chromium (it generates the account template in a browser).
      - name: Smoke test — the production dist boots before it ships
        run: SMOKE_PRODUCTION=1 node scripts/smoke-web-app.mjs

      # No actions/configure-pages: deploy-pages.yml called it but never read an
      # output, and it was the only reason that job needed `pages: write` — a
      # grant on the runner that executes the repo's build scripts. Whether
      # Pages is on stays a repo setting (Settings -> Pages -> Source = "GitHub
      # Actions"), which is where the deploy already required it to be.
      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/web-app/dist

  # Privileged, and holds the ONLY write token in this workflow. No checkout,
  # no build — see the header.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: assets

      # No checkout, so gh needs the repo named explicitly (GH_REPO); the tag
      # is verified server-side by --verify-tag.
      - name: Create GitHub release (web-app zip + customize script)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Releases are immutable: assets can only be attached at creation
          # (a later `gh release upload` gets HTTP 422), so create the release
          # and its assets in one shot. On re-runs a complete release is
          # skipped; an asset-less one (e.g. a run that died mid-create) can't
          # be repaired in place and must be deleted first.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -qx 'slothfulchat-customize.mjs'; then
              echo "release $GITHUB_REF_NAME already exists with assets — skipping"
            else
              echo "::error::release $GITHUB_REF_NAME exists without assets and is immutable. Delete it (gh release delete $GITHUB_REF_NAME) and re-run."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              "assets/slothfulchat-web-$GITHUB_REF_NAME.zip" assets/slothfulchat-customize.mjs
          fi

  # Privileged: holds an id-token: write for npm. No checkout, no build — see
  # the header.
  #
  # `needs: release` keeps the original ordering: release first, npm staging
  # after, so a staging hiccup (e.g. a package's trusted publisher not
  # configured yet) can never block the release.
  publish:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance
    steps:
      # NO registry-url here: it makes setup-node write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, which npm then uses INSTEAD of the OIDC
      # trusted-publishing exchange (unauthenticated PUT -> 404).
      # Node 22 is also what `npm stage` needs (>= 22.14.0).
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1 and `npm stage` needs >= 11.15.0;
      # Node 22 ships 10.x. No sudo: sudo's PATH hits the system npm, leaving
      # the toolcache npm (the one this job actually runs) old — publish then
      # dies with ENEEDAUTH.
      # Pinned to an EXACT version, not @11 or @latest: npm 12.0.0 (2026-07-08)
      # crashes on provenance publish ("Cannot find module 'sigstore'" from
      # libnpmpublish/provenance.js — broke the v0.3.0 run), and even a `@11`
      # floating pin can drift onto a bad patch. 11.18.0 is the version that
      # published v0.2.0 cleanly. Bump this deliberately after testing a newer
      # npm; re-evaluate once a fixed npm 12.x is out.
      - name: Update npm (trusted publishing + npm stage support)
        run: npm install -g npm@11.18.0 && npm --version

      - name: Download the npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: npm-tarballs

      # name@version is read back OUT of each tarball rather than from a
      # checked-out package.json: the tarball is what gets published, so the
      # skip check and the upload can't disagree about what is being shipped.
      # --ignore-scripts: publishing a prebuilt tarball must run no code.
      #
      # `npm stage publish`, not `npm publish` — nothing here becomes
      # installable until a human approves it (see the header and RELEASING.md).
      # A brand-new package cannot be staged; its first version has to go up
      # with plain `npm publish` before it can join this loop.
      - name: Stage the tarballs whose version is new
        run: |
          set -euo pipefail
          for tgz in npm-tarballs/*.tgz; do
            spec=$(tar -xzOf "$tgz" package/package.json |
              node -e "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(p.name+'@'+p.version)")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec already on the registry — skipping"
              continue
            fi
            echo "staging $spec from $tgz"
            # Re-running a tag after a partial train hits the version already
            # sitting in the stage queue. `npm view` cannot see that (staged
            # versions are invisible until approved) and an OIDC token may not
            # call `npm stage list`, so the version conflict is the only signal
            # there is. Every other failure is real and stops the job.
            #
            # MATCH THE CODE, NOT THE PROSE. npm throws nothing of its own for a
            # stage-queue collision — the uniqueness index is registry-side, so
            # what comes back is npm-registry-fetch's HTTP wrapper: code `E409`
            # and a message whose human half is copied verbatim out of the
            # registry's response body (npm-registry-fetch/lib/errors.js). It is
            # NOT EPUBLISHCONFLICT; npm only ever uses that code to render an
            # error, never to raise one. The third alternative is the one string
            # the CLI does own (lib/commands/publish.js), which fires client-side
            # if the packument ever disagrees with the `npm view` above.
            # If the registry answers a status other than 409 this stops the job
            # instead of skipping — loud, and the safe direction.
            if ! out=$(npm stage publish "$tgz" --access public --ignore-scripts 2>&1); then
              echo "$out"
              echo "$out" | grep -qE 'E409|409 Conflict|cannot publish over the previously published versions' || exit 1
              echo "$spec is already staged — skipping"
            fi
          done
          echo "::notice::Staged, not published: nothing is installable until you approve it. \`npm stage list\` then \`npm stage approve <id>\` (2FA), or approve on npmjs.com."

  # Prod (web.slothful.chat). Privileged: id-token mints the OIDC token
  # actions/deploy-pages authenticates with. It checks out nothing and runs no
  # repository code — it only publishes the artifact build produced.
  #
  # `needs: build`, NOT `needs: publish`: prod and the npm train fail
  # independently (see the header).
  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Job-level, so the release and npm jobs don't queue behind a Pages deploy.
    # One deploy at a time; never cancel an in-flight deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    # Needs a `v*` tag deployment rule (repo Settings -> Environments ->
    # github-pages -> "Deployment branches and tags") or tag deploys are
    # rejected with "not allowed to deploy due to environment protection
    # rules".
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
