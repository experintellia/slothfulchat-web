# CI: run the project's tests on pull requests (and pushes to main).
#
# Two jobs:
#   lint   — fast, no submodules, no wasm build: syntax-checks every .mjs and
#            type/compile-checks the standalone Rust shim crate. Gives quick
#            feedback on obvious breakage in seconds.
#   test   — the real test suite. Builds the whole app through the same
#            .github/actions/build-web-app the deploy workflows use (patched
#            core + upstream desktop bundle + wasm + assembled dist/), then
#            runs the headless Playwright smoke and E2E suites on top of it.
#
# The build half of `test` used to be a hand-copied duplicate of
# deploy-pages.yml carrying a "keep the two in sync" note. It is now the same
# composite action, with wasm-opt and production turned off — so the ordering
# traps and toolchain setup are described in exactly one place.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref (a new push to a PR obsoletes the old).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- fast checks: no submodules, no wasm, no network ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules — nothing here needs them)
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `pnpm install` can't run here (the jsonrpc-client file: dep doesn't
      # exist until apply-patches), but `node --check` needs no deps — it just
      # parses. Catches syntax errors in the scripts + package sources.
      - name: Syntax-check all .mjs sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find scripts packages -name '*.mjs' \
                     -not -path '*/node_modules/*' -not -path '*/dist/*')
          exit $fail

      # dependency-free node:test suites for pure logic (config templating,
      # the analytics pre-notice gate, translation-editor serialization, blob
      # response headers)
      - name: Unit-test pure helpers
        run: >-
          node --test
          packages/web-app/instance-config.test.mjs
          packages/web-app/analytics-gate.test.mjs
          packages/web-app/src/translation-serialize.test.ts
          packages/web-app/src/blob-response.test.ts
          packages/web-app/src/blob-route.test.ts
          packages/web-app/src/fatal-report.test.ts
          packages/web-app/src/emoji-sets.test.ts
          packages/web-app/serve.test.mjs
          scripts/mock-madmail.test.mjs
          scripts/harness.test.mjs

      # packages/calls engine/ + bridge/ (docs/calls.md M0+): dependency-free —
      # Node's built-in type-stripping test runner needs no pnpm install, only
      # "erasable" TS syntax (see packages/calls/tsconfig.base.json). bridge/
      # imports only node builtins + local .ts (no react/DOM value imports), so
      # it runs here too; this covers the popup-signaling IPC tests (M4).
      - name: Unit-test packages/calls engine + bridge (interop, ICE, popup IPC)
        run: node --test packages/calls/engine/*.test.ts packages/calls/bridge/*.test.ts

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tokio-wasm-shim

      # The shim crate has no submodule deps and builds natively in seconds
      # (native target just re-exports real tokio). clippy catches regressions
      # in the native code paths; the wasm paths are exercised by the full
      # build in `smoke`.
      - name: Check + clippy the tokio-wasm-shim crate (native)
        working-directory: crates/tokio-wasm-shim
        run: |
          cargo check --all-targets
          cargo clippy --all-targets

  # ---- real test suite: full build + headless smoke/E2E tests ----
  # The build half is the same composite action the deploy workflows run, so
  # what CI tests and what ships are built by one sequence, not two that have
  # to be kept in step by hand.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout (with submodules — vendor/core + vendor/deltachat-desktop)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The whole build — toolchains, patch stacks, caches, jsonrpc-client,
      # wasm, assembled dist/ — lives in the composite action the three deploy
      # workflows already use, including all three ordering traps. Both inputs
      # are off here: CI wants a functional build, not a shippable one, and
      # they are the two slowest passes.
      - name: Build web-app (patched core + wasm + dist/)
        uses: ./.github/actions/build-web-app
        with:
          wasm-opt: 'false'
          production: 'false'

      # packages/calls (docs/calls.md M0): per-subfolder typecheck now that
      # real @types/node / @types/react / react are installed — engine/'s
      # narrower tsconfig (no "jsx", see engine/tsconfig.json) is what actually
      # enforces the type-level half of the React/DOM import boundary.
      - name: Typecheck packages/calls (engine/ui/bridge)
        run: pnpm --filter @slothfulchat/calls build

      # Playwright chromium for the headless smoke suites (--with-deps pulls the
      # runner's shared libs). Uses the pinned playwright from the lockfile.
      # Browser downloads are cached; `playwright install` skips the download
      # when the pinned browser build is already in ~/.cache/ms-playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # core-wasm smoke: serves the example page, asserts get_system_info +
      # typed client + fs side channel answer from inside the browser.
      - name: Smoke test — core-wasm boots in the browser
        run: pnpm --filter @slothfulchat/core-wasm test

      # account ids/fingerprints e2e (issue #75): accounts.toml write-through
      # survives reload with ids/fingerprints/selection intact and no self-heal.
      - name: E2E test — account ids survive reload (issue #75)
        run: node scripts/test-account-ids-e2e.mjs

      # account churn e2e (post-#75 sahpool-leak incident): ~32 add+remove
      # cycles must not leak sahpool pool slots, brick boot with SQLITE_CANTOPEN,
      # or trip the self-heal on a valid accounts.toml.
      - name: E2E test — account churn does not leak sahpool slots
        run: node scripts/test-account-churn-e2e.mjs

      # web-app smoke: boots the proxy + static server, asserts the frontend
      # renders on the wasm core and keeps its proxy config across an
      # SW-controlled reload.
      - name: Smoke test — frontend boots on the wasm core
        run: pnpm --filter @slothfulchat/web-app test

      # translation editor e2e (offline, onboarding screen): the editor opens in
      # a separate popup window and editing a string live-refreshes the app.
      - name: E2E test — translation editor popup + live refresh
        run: node scripts/test-txedit-e2e.mjs

      # bridge picker e2e (no proxy, no core boot): option list from an
      # injected instance config, preselection, localStorage save semantics
      - name: E2E test — bridge picker dialog
        run: node scripts/test-bridge-dialog.mjs

      # fatal-start dialog e2e (no proxy, no core boot): a browser with
      # WebAssembly removed — Lockdown Mode's effect — is told so rather than
      # blamed on storage, and the error text can actually leave a dead app.
      - name: E2E test — fatal-start dialog
        run: node scripts/test-fatal-dialog.mjs

      # HTML email viewer security check (fully offline, no core boot; builds
      # its own bundle): sanitizer strips scripts/meta/base/javascript: URLs,
      # sandbox gives the mail an opaque no-script origin, authored CSP keeps
      # remote images off the network until the user opts in, links open
      # target=_blank noopener noreferrer.
      - name: Security check — HTML email viewer sandbox
        run: node scripts/test-html-email.mjs

      # HTML email viewer e2e (offline, mock madmail, real wasm core): one
      # account sends a message with crafted hostile HTML to a second; the
      # receiver's "Show Full Message…" button opens the viewer; asserts the
      # crafted script never runs, the frame is cross-origin isolated, and the
      # remote tracking image is CSP-blocked until the ⋮-menu opt-in, then
      # reaches the network. Verifies the whole path the unit check above can't:
      # core has_html -> frontend button -> openMessageHTML -> sandboxed render.
      - name: E2E test — HTML email viewer on the wasm core
        run: node scripts/test-html-email-e2e.mjs

      # relay picker e2e (offline: the directory fetch and the bridge /dns +
      # /tcp probes are both mocked): the instant-onboarding relay dropdown
      # lists the directory relays default-first, lazily probes reachability +
      # latency once opened, offers an "Other…" host field, and the consent
      # link follows the selection.
      - name: E2E test — relay picker dropdown
        run: node scripts/test-relay-picker.mjs

      # chat export e2e (fully offline, mock madmail): drives the three-dot
      # "Export Chat" flow, unpacks the zip, renders the extracted index.html
      # viewer over file:// and exercises the "Save single-file HTML" button.
      - name: E2E test — chat export to zip
        run: node scripts/test-export-chat-html.mjs

      # resizable sidebar e2e (fully offline, mock madmail): drag the chat-list
      # divider, min-width clamp, persistence across reload, keyboard resize,
      # double-click reset.
      - name: E2E test — resizable chat-list sidebar
        run: node scripts/test-sidebar-resize-e2e.mjs

      # video poster self-check (fully offline, no core-wasm needed): record a
      # canvas of a known colour, grab a frame with the real videoPoster module,
      # assert the JPEG decodes back to that colour (i.e. not a blank frame).
      - name: Self-check — video poster frame grab
        run: node scripts/test-video-poster.mjs

      # media metadata self-check (fully offline): record real audio and video
      # whose containers carry no duration — like our own recorder's mp3 — and
      # assert the reader still measures them instead of reporting Infinity.
      - name: Self-check — media metadata (duration / pixel size)
        run: node scripts/test-media-metadata.mjs

      # unfurl service self-check (fully offline): metadata + inline image,
      # SSRF guards (private-IP / literal-IP refusal), size cap, rate limit.
      - name: Self-check — unfurl service
        run: node scripts/test-unfurl.mjs

      # link-preview e2e (fully offline: mock madmail + a local OpenGraph
      # server on *.localhost + the unfurl service): type URL → ghost → Add →
      # baked PNG card attaches → send; layout toggle, remove, dismiss, and
      # the CORS-blocked→unfurl fallback path.
      - name: E2E test — link-preview ghost UI
        run: node scripts/test-link-preview-e2e.mjs

      # boot-error screen smoke (fully offline): breaks the built bundles and
      # asserts static/boot-error.js renders the failure detail instead of a
      # blank page. The only coverage boot-error.js has.
      - name: Smoke test — pre-bundle boot-error screen
        run: node scripts/smoke-boot-error.mjs

      # two-tab handling (fully offline): the core holds an exclusive OPFS lock,
      # so a second tab must show the "already running in another tab" dialog —
      # and a plain single-tab reload must NOT false-positive it.
      - name: E2E test — second tab is told, single-tab reload is not
        run: node scripts/test-two-tabs.mjs

      # hard reload (fully offline, SW-only): a SW-bypassing reload must
      # auto-reload once so blobs are served again, rather than leaving the
      # page with a dead /blobs/ route.
      - name: E2E test — hard reload recovers the blobs service worker
        run: node scripts/test-pwa-hard-reload.mjs

      # WS→TCP proxy allowlist guard: DNS for an allowlisted domain populates
      # the IP allow-list, a tunnel to a never-resolved IP is refused, the
      # default bind stays loopback-only, and a malformed frame kills only its
      # own connection. Needs network for the two allowlisted-domain cases
      # (nine.testrun.org) — the bind/frame cases are offline.
      - name: Security check — WS→TCP proxy chatmail allowlist
        run: node scripts/test-ws-tcp-proxy-allowlist.mjs

      # NOTE: scripts/test-read-time-e2e.mjs (estimated time-to-read badge) and
      # scripts/test-webxdc-isolation.mjs (per-subdomain webxdc storage) are
      # kept but NOT wired in: the first provisions a real chatmail account
      # (nine.testrun.org/new) rather than a mock madmail server, and the second
      # needs the `caddy` binary for the wildcard-subdomain harness. Both run
      # locally; porting the first to mock madmail would make it CI-able.

      # NOTE: scripts/test-calls-e2e.mjs (loopback audio call) is intentionally
      # NOT wired in yet. It is designed to run offline in CI, but currently
      # times out reaching the chat-list UI (#new-chat-button) after provisioning
      # a webimap account and reloading — the provision→reload→UI path is
      # untested (test-webimap.mjs only ever drives via rpc, never reloads into
      # the UI), likely an accounts-persist-before-reload race. Needs debugging
      # against a real wasm build before it can be a CI gate; run locally for now.
