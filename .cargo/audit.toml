# cargo-audit config for the CI dependency gate (audit finding L-05).
#
# Read from the repo root, so `cargo audit --file <lockfile>` must be run from
# there. Covers the two checked-in lockfiles:
#   packages/core-wasm/rust/Cargo.lock  — the wasm build's full graph (its path
#                                         deps pull in all of patched core)
#   crates/tokio-wasm-shim/Cargo.lock   — the standalone shim crate
# build/core/Cargo.lock is not covered: it does not exist until
# `pnpm apply-patches` runs, and core-wasm's lock is a superset of it anyway.
#
# EVERY id below is a reviewed, versioned exception. The gate's job is to fail
# on anything NOT listed. When you add one, say what it is and why it is not
# actionable here; when the pinned core graph moves, delete the ones that go
# away rather than letting the list rot.
#
# "Not actionable" must mean the vulnerable CODE is not reached, not merely
# that no upgrade is available. If you cannot show that, leave the id out and
# let the gate go red — a list of things we have decided to live with, mixed in
# with things that genuinely cannot fire, is worth nothing to the next reader.
#
# Reachability was checked with, from packages/core-wasm/rust:
#   cargo tree --target wasm32-unknown-unknown --edges normal -i <crate>
# (requires build/core, i.e. `pnpm apply-patches` first). Last done 2026-08-04.
#
# NOT FIXABLE HERE: every crate below is pulled in transitively by the pinned
# chatmail core / iroh / rpgp graph. Moving those pins is a separate, much
# larger piece of work — deliberately out of scope for this gate.

[advisories]
ignore = [
  # --- absent from the wasm32-unknown-unknown graph -------------------------
  # `cargo tree --target wasm32-unknown-unknown` prints "nothing to print" for
  # both crates: they are native-only deps, never compiled into the wasm core.
  "RUSTSEC-2026-0204", # crossbeam-epoch 0.9.18 — invalid ptr deref in fmt::Pointer
  "RUSTSEC-2026-0119", # hickory-proto 0.25.2 — O(n^2) name compression, CPU exhaustion
  "RUSTSEC-2026-0118", # hickory-proto 0.25.2 — NSEC3 proof unbounded loop

  # --- linked into the wasm core, but the vulnerable code is not reached ------
  # Each entry below was checked against the built wasm binary's symbol table,
  # not just `cargo tree`. Being in the graph is not the same as being called.

  # rustls-webpki: the graph carries TWO copies, and the live one is patched.
  #
  #   rustls-webpki 0.102.8  <- iroh 0.35 / iroh-relay 0.35
  #   rustls-webpki 0.103.13 <- rustls 0.23.41 <- tokio-rustls <- deltachat
  #
  # IMAP/SMTP TLS terminates inside the core on rustls 0.23.41 (patch
  # core/0003 routes the wasm non-strict branch to wrap_rustls too), so the
  # verifier that actually validates mail-server certificates is 0.103.13 —
  # at or above every patched range below (0.103.10 / .12 / .12 / .13).
  #
  # The 0.102.8 copy is iroh's, and iroh imports exactly three things from it:
  # `Error`, `ring_algs` (algorithm constants handed to rustls) and a
  # `types` re-export. It parses certificates with x509-parser, and its
  # verifier checks for a single self-signed cert with a libp2p extension —
  # no chain building, no trust anchors, no name constraints, no CRLs. The
  # built wasm confirms it: the 0.102.8 instance contributes 16 symbols, all
  # of them Error/DerType/RingAlgorithm, and nothing from verify_cert,
  # subject_name or crl.
  #
  # Do NOT re-justify these as "iroh is unused" — iroh IS linked (~2687
  # symbols) and a scanned backup2 QR still reaches Endpoint::bind. The
  # argument is about which webpki APIs iroh calls, which holds either way.
  "RUSTSEC-2026-0099", # name constraints accepted for wildcard-name certs
  "RUSTSEC-2026-0104", # reachable panic parsing a CRL
  "RUSTSEC-2026-0098", # name constraints for URI names incorrectly accepted
  "RUSTSEC-2026-0049", # CRLs not authoritative by distribution point

  # ml-dsa 0.0.4 <- pgp 0.20 (draft-pqc feature) <- deltachat. Timing leak in
  # `decompose` over values derived from the SECRET components s2/t0 — a
  # signing-side leak; verification touches only public data. Reaching it
  # needs an ML-DSA *self* key, and core hardcodes Ed25519Legacy +
  # ECDH(Curve25519Legacy) at src/pgp.rs:36-37 with no algorithm choice
  # anywhere. No supported action produces one.
  "RUSTSEC-2025-0144",

  # rsa 0.9.10 <- pgp 0.20 <- deltachat. Marvin attack: a PRIVATE-key timing
  # leak. Sorting the paths — verifying a signature from, or encrypting to, an
  # RSA-keyed contact are public-key ops and unaffected; decrypting and
  # signing use OUR key, which is Ed25519/X25519 per src/pgp.rs:36-37. So the
  # vulnerable code runs only with an RSA self key.
  #
  # TRIP-WIRE: `import_self_keys` exists on the JSON-RPC surface with no UI
  # caller today (no key-management screen, no Autocrypt Setup Message). If
  # key import or management ever ships, this becomes reachable without the
  # dependency graph changing — re-review this entry then.
  "RUSTSEC-2023-0071",

  # --- unsoundness (gated by CI's `-D unsound`) -----------------------------
  # event-listener 5.4.1 <- async-broadcast / async-lock / event-listener-strategy.
  # `!Send` tags crossing threads via StackSlot. The wasm core is single
  # threaded (no wasm atomics/threads in this build), so there is no second
  # thread for a tag to cross to.
  "RUSTSEC-2026-0221",

  # lru 0.12.5 <- iroh-relay, lru 0.13.0 <- pkarr. Both lru advisories below
  # concern those same two copies, and neither has a fixed release the pinned
  # versions accept: iroh-relay 0.35 requires ^0.12, pkarr 3.10 requires
  # ^0.13.0.
  #
  # NOT a fix for either: target-gating iroh out of the wasm build. Cargo.lock
  # is target-independent, so a `cfg(not(target_arch = "wasm32"))` dep stays in
  # it and `cargo audit --file` still reports it — shadowsocks is gated exactly
  # that way by patch core/0001 and is still in the lock. Gating iroh is worth
  # doing for what we ship (issue #236), but it would only move these two ids
  # from this section up into the "absent from the wasm32 graph" one.
  #
  # `IterMut` violates Stacked Borrows. Miri-level UB in a code path neither
  # caller reaches from wasm.
  "RUSTSEC-2026-0002",

  # `LruCache::pop()` is not panic-safe: if a key's `Drop` unwinds, `detach()`
  # is skipped and a later eviction writes through the dangling list pointer.
  # Three independent reasons it cannot fire here, any one of them sufficient:
  #
  #  1. Unwinding does not exist in what we ship. wasm32-unknown-unknown's
  #     target spec is panic-strategy = "abort" (`rustc -Zunstable-options
  #     --print target-spec-json --target wasm32-unknown-unknown`) and nothing
  #     overrides it — no `panic =` in any profile, no -Cpanic in
  #     .cargo/config.toml, no build-std. A panicking Drop aborts; it never
  #     unwinds past `pop()`, and the `catch_unwind` the advisory's own
  #     preconditions require cannot catch anything.
  #  2. Neither caller calls the affected method. iroh-relay holds
  #     `LruCache<PublicKey, ()>` (src/key_cache.rs) and pkarr holds
  #     `LruCache<CacheKey, SignedPacket>` (src/client/cache.rs); neither
  #     calls pop()/pop_lru()/pop_entry() anywhere.
  #  3. Neither key type can panic on drop: iroh's PublicKey is a
  #     `CompressedEdwardsY` (`[u8; 32]`) newtype and pkarr's CacheKey is
  #     `[u8; 20]` — plain arrays, no Drop impl to run at all.
  #
  # REVISIT when the pinned iroh/pkarr accept lru >= 0.18.2 (delete this), or
  # if this build ever enables wasm exception handling, which would retire
  # reason 1 and leave the argument resting on 2 and 3.
  "RUSTSEC-2026-0253",
]

# CI passes `-D unsound` so unsoundness advisories (warnings by default) gate
# too. `unmaintained` is deliberately NOT denied — it is a maintenance signal,
# not a defect, and fires constantly on transitive crates (instant, paste).
# Yanked crates are skipped entirely (`--no-yanked`): they carry no advisory
# id, so there would be no way to write a reviewed exception for one (spin
# 0.9.8 / 0.10.0 are currently yanked and unavoidable), and the check costs a
# crates.io round trip per crate.
