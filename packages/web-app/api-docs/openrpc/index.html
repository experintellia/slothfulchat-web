<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlothfulChat core API — OpenRPC</title>
<style>
  :root { --bg:#15171b; --panel:#1d2026; --line:#2c313a; --fg:#e6e8eb; --muted:#9aa3af; --accent:#3793ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 system-ui,sans-serif; background:var(--bg); color:var(--fg);
         height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  a { color:var(--accent); }
  header { flex:none; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px;
           padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header .meta { color:var(--muted); font-size:12.5px; }
  header nav { margin-left:auto; display:flex; gap:8px; }
  header nav a { font-size:12px; text-decoration:none; color:var(--muted);
                 border:1px solid var(--line); border-radius:7px; padding:4px 9px; white-space:nowrap; }
  header nav a:hover { color:var(--fg); border-color:var(--accent); }
  .filter { flex:none; padding:8px 16px; border-bottom:1px solid var(--line); }
  .filter input { width:100%; max-width:420px; background:var(--panel); color:var(--fg);
                  border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; }
  .layout { display:flex; flex:1; min-height:0; }
  aside { width:290px; flex:none; overflow:auto; border-right:1px solid var(--line); padding:8px 0; }
  aside a { display:block; padding:3px 16px; font-size:13px; text-decoration:none; color:var(--muted);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  aside a:hover, aside a:focus { color:var(--fg); background:var(--panel); }
  main { flex:1; overflow:auto; padding:16px 20px 60vh; }
  section { border-bottom:1px solid var(--line); padding:14px 0; scroll-margin-top:8px; }
  section h2 { margin:0 0 6px; font-size:15px; font-family:ui-monospace,monospace; }
  section h2 a { text-decoration:none; color:var(--fg); }
  section h2 a:hover { color:var(--accent); }
  .desc { color:var(--muted); font-size:13.5px; white-space:pre-wrap; margin:0 0 8px; }
  td.desc { margin:0; max-width:46ch; }
  aside .label { padding:12px 16px 2px; }
  table { border-collapse:collapse; font-size:13px; margin:0 0 6px; }
  td { padding:2px 14px 2px 0; vertical-align:top; }
  td:first-child { font-family:ui-monospace,monospace; color:var(--fg); white-space:nowrap; }
  .ty { font-family:ui-monospace,monospace; color:#8fd08f; }
  .req { color:#e6a15c; font-size:11px; }
  .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
           display:block; margin:8px 0 2px; }
  .empty { color:var(--muted); font-size:13px; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;
        overflow:auto; font-size:12px; margin:0; max-height:340px; }
  details > summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  #status { padding:16px 20px; color:var(--muted); }
  @media (max-width:720px) { aside { display:none; } }
</style>
</head>
<body>

<header>
  <h1>SlothfulChat core API <span class="meta" id="info"></span></h1>
  <nav>
    <a href="../typescript/">TypeScript reference</a>
    <a href="../openrpc.json">raw openrpc.json</a>
    <a href="../">/api-docs/</a>
  </nav>
</header>
<div class="filter"><input id="q" type="search" placeholder="Filter methods…" autocomplete="off"></div>
<div class="layout">
  <aside id="nav"></aside>
  <main id="out"><p id="status">Loading ../openrpc.json…</p></main>
</div>

<script>
// Renders the OpenRPC document generated by yerpc from the patched core.
//
// Why not @open-rpc/docs-react or the open-rpc generator's docs template: both
// are React apps (docs-react also pulls Material-UI), so shipping them means a
// bundler step and ~1 MB of vendored JS to render a list of methods; the
// playground is hosted and CDN-fed, which the CSP posture rules out. This is
// the same shape as /changelog/: one static page fetching one same-origin file
// with a relative URL. No CDN, no build step, no runtime dependency.
//
// ponytail: renders the subset of JSON Schema yerpc/schemars actually emit
// (ref, oneOf/anyOf/allOf, type, array items, enum const). Anything else falls
// back to the raw JSON in a <details>, so nothing is silently dropped. If the
// spec ever grows shapes worth first-class rendering, extend `ty()`.

const $ = (s) => document.querySelector(s)

function node(tag, props, kids) {
  const n = Object.assign(document.createElement(tag), props ?? {})
  for (const k of kids ?? []) n.append(k)
  return n
}

/** Fragment id: `m-` for a method, `s-` for a component schema. */
const slug = (name, kind = 'm') => kind + '-' + name

/** Human-readable type for a JSON Schema node, as a string. */
function ty(s) {
  if (!s || typeof s !== 'object') return 'any'
  if (s.$ref) return s.$ref.replace(/^#\/components\/schemas\//, '')
  if (s.const !== undefined) return JSON.stringify(s.const)
  if (s.enum) return s.enum.map((v) => JSON.stringify(v)).join(' | ')
  for (const k of ['oneOf', 'anyOf', 'allOf']) {
    if (Array.isArray(s[k])) {
      const parts = [...new Set(s[k].map(ty))]
      return parts.length === 1 ? parts[0] : parts.join(k === 'allOf' ? ' & ' : ' | ')
    }
  }
  const t = Array.isArray(s.type) ? s.type.filter((x) => x !== 'null') : s.type ? [s.type] : []
  const nullable = Array.isArray(s.type) && s.type.includes('null')
  let out = t[0] ?? 'any'
  if (out === 'array') out = ty(s.items) + '[]'
  if (out === 'integer') out = 'number'
  return nullable ? out + ' | null' : out
}

function rows(entries) {
  return node('table', {}, entries.map(([name, required, schema]) => node('tr', {}, [
    node('td', { textContent: name }),
    node('td', {}, [node('span', { className: 'ty', textContent: ty(schema) })]),
    node('td', { className: 'req', textContent: required ? '' : 'optional' }),
    node('td', { className: 'desc', textContent: schema?.description ?? '' }),
  ])))
}

/** `properties` of an object schema as table rows, honouring `required`. */
function propRows(s) {
  const required = new Set(s.required ?? [])
  return rows(Object.entries(s.properties).map(([n, p]) => [n, required.has(n), p]))
}

/** Label a oneOf/anyOf variant: its title, or the value of its tag const. */
function variantName(v, i) {
  if (v.title) return v.title
  const tag = Object.values(v.properties ?? {}).find((p) => p.const !== undefined)
  return tag ? JSON.stringify(tag.const) : '#' + i
}

function methodSection(m) {
  const parts = [node('h2', {}, [node('a', { href: '#' + slug(m.name), textContent: m.name })])]
  if (m.description || m.summary) {
    parts.push(node('p', { className: 'desc', textContent: m.description || m.summary }))
  }
  parts.push(node('span', { className: 'label', textContent: 'Parameters' }))
  parts.push(
    m.params?.length
      ? rows(m.params.map((p) => [p.name, p.required !== false, p.schema]))
      : node('p', { className: 'empty', textContent: 'none' })
  )
  parts.push(node('span', { className: 'label', textContent: 'Result' }))
  parts.push(rows([[m.result?.name ?? 'result', true, m.result?.schema]]))
  return node('section', { id: slug(m.name) }, parts)
}

function schemaSection(name, s) {
  const parts = [node('h2', {}, [node('a', { href: '#' + slug(name, 's'), textContent: name })])]
  if (s.description) parts.push(node('p', { className: 'desc', textContent: s.description }))
  if (s.properties) {
    parts.push(node('span', { className: 'label', textContent: 'Properties' }))
    parts.push(propRows(s))
  }
  for (const key of ['oneOf', 'anyOf']) {
    for (const [i, v] of (s[key] ?? []).entries()) {
      parts.push(node('span', { className: 'label', textContent: 'Variant ' + variantName(v, i) }))
      if (v.description) parts.push(node('p', { className: 'desc', textContent: v.description }))
      if (v.properties) parts.push(propRows(v))
      else parts.push(node('p', { className: 'empty', textContent: ty(v) }))
    }
  }
  // Everything above is a readable projection; the spec itself is right here so
  // a shape the projection doesn't cover is never silently lost.
  parts.push(node('details', {}, [
    node('summary', { textContent: 'JSON Schema' }),
    node('pre', { textContent: JSON.stringify(s, null, 2) }),
  ]))
  return node('section', { id: slug(name, 's') }, parts)
}

function render(doc) {
  const methods = [...(doc.methods ?? [])].sort((a, b) => a.name.localeCompare(b.name))
  const schemas = Object.entries(doc.components?.schemas ?? {}).sort((a, b) =>
    a[0].localeCompare(b[0])
  )
  $('#info').textContent =
    `OpenRPC ${doc.openrpc ?? '?'} · ${doc.info?.title ?? ''} ${doc.info?.version ?? ''}`.trim() +
    ` · ${methods.length} methods, ${schemas.length} schemas`

  const out = $('#out')
  const nav = $('#nav')
  out.textContent = ''
  nav.textContent = ''
  const link = (id, text) => {
    const a = node('a', { href: '#' + id, textContent: text })
    a.dataset.k = text.toLowerCase()
    nav.append(a)
    return a
  }
  for (const m of methods) {
    out.append(methodSection(m))
    link(slug(m.name), m.name)
  }
  out.append(node('h2', { className: 'label', textContent: 'Schemas' }))
  nav.append(node('div', { className: 'label', textContent: 'Schemas' }))
  for (const [name, s] of schemas) {
    out.append(schemaSection(name, s))
    link(slug(name, 's'), name)
  }

  $('#q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase()
    for (const a of nav.querySelectorAll('a')) a.hidden = q !== '' && !a.dataset.k.includes(q)
    for (const s of out.querySelectorAll('section')) {
      s.hidden = q !== '' && !s.id.slice(2).toLowerCase().includes(q)
    }
  })
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView()
}

const fail = (e) => {
  $('#out').textContent = ''
  $('#out').append(node('p', { id: 'status', textContent: 'Could not render ../openrpc.json: ' + e.message }))
}

fetch('../openrpc.json')
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status + ' ' + r.statusText))))
  .then((doc) => {
    try {
      render(doc)
    } catch (e) {
      fail(e)
      throw e
    }
  })
  .catch(fail)
</script>

</body>
</html>
